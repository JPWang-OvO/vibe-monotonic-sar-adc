[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ic-design-template"
version = "0.1.0"
description = "Cell/view sources, OA round trips and remote IC verification flows"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
include = ["regression*", "virtuoso*", "physical*"]

[tool.setuptools.package-data]
"virtuoso.oa" = ["*.il"]
